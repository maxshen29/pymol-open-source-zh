name: Build Wheel

# Builds an installable PyMOL wheel (with the embedded CJK font for the
# internal GUI) on all three platforms.  Download the "pymol-wheels" artifact
# from the run summary.
#
# windows-latest has MSVC preinstalled, so this needs no local toolchain.

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'layer1/**'
      - 'layer4/**'
      - 'modules/**'
      - 'data/i18n/**'
      - 'setup.py'
      - 'tools/gen_font_header.py'
      - '.github/workflows/build-wheel.yml'

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            py: "3.12"
          - os: ubuntu-22.04
            py: "3.12"
          - os: macos-latest
            py: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get --no-install-recommends install \
            libfreetype6-dev libglew-dev libglm-dev libpng-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install freetype glew glm libpng

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install miniforge3 -y
          echo "$env:CONDA" | Out-File -Append -FilePath $env:GITHUB_PATH
          echo "$env:CONDA\Scripts" | Out-File -Append -FilePath $env:GITHUB_PATH
          conda create -y --name build -c conda-forge --override-channels `
            python=${{ matrix.py }} pip cmake freetype glew glm libpng numpy
          echo "$env:CONDA\envs\build" | Out-File -Append -FilePath $env:GITHUB_PATH
          echo "$env:CONDA\envs\build\Scripts" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip setuptools cmake numpy
          python -m pip wheel --no-build-isolation --no-deps `
            --config-settings testing=False `
            --config-settings json=False `
            --config-settings use-msgpackc=no `
            --config-settings libxml=no `
            -w dist .

      - name: Smoke test (import + i18n)
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist --no-deps pymol-open-source
          python -c "import pymol, pymol2; p=pymol2.PyMOL(); p.start(); p.cmd.fragment('ala'); print('atoms', p.cmd.count_atoms()); import pymol.i18n as i; i.set_language('zh_CN'); print('zh', i.tr('File')); p.stop()"

      - uses: actions/upload-artifact@v4
        with:
          name: pymol-wheels-${{ runner.os }}
          path: dist/*.whl
